spring:
  application.name: opspilot-agent
  datasource: { url: jdbc:h2:mem:opspilot;DB_CLOSE_DELAY=-1;MODE=PostgreSQL, username: sa, password: '' }
  jpa: { hibernate.ddl-auto: create-drop, open-in-view: false }
  h2.console.enabled: true
  ai.mcp.server: { name: opspilot-mcp, version: 0.1.0 }
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: always
opspilot:
  rag: { chunk-size: 700, chunk-overlap: 120, top-k: 4 }
  llm.provider: template
logging.level.com.deepanshuraj.opspilot: INFO
